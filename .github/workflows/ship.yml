# =============================================================================
# ship.yml — 코드가 올라가면 폰(웹)과 PC(설치파일)를 자동으로 최신으로 만든다
# -----------------------------------------------------------------------------
# [무엇을 하나?]
#   main 브랜치에 코드가 올라오고 package.json 의 version 이 바뀌었으면,
#   ① 테스트·타입검사 → ② 웹앱 빌드 후 capri-web 저장소로 배포(폰 즉시 반영)
#   → ③ 윈도우 설치파일(exe) 빌드 → kyle-bot-releases 에 릴리스 게시(PC 자동 업데이트)
#   까지 사람 손 없이 자동으로 합니다.
#
# [필요한 것 — 딱 하나: 토큰]
#   배포 대상이 **다른 저장소**(kyle-bot-releases, capri-web)라서,
#   GitHub 이 기본으로 주는 토큰(GITHUB_TOKEN)으로는 권한이 없습니다.
#   그래서 아래 이름의 시크릿이 필요합니다:
#
#       CAPRI_DEPLOY_TOKEN
#
#   만드는 법(사장님이 한 번만):
#     1. GitHub → 우측 상단 프로필 → Settings → Developer settings
#        → Personal access tokens → **Fine-grained tokens** → Generate new token
#     2. Repository access: **Only select repositories** →
#        `kyle-bot-releases` 와 `capri-web` 두 개 선택
#     3. Permissions → Repository permissions → **Contents: Read and write**
#        (릴리스 게시와 파일 푸시에 필요합니다)
#     4. 만들어진 토큰 문자열 복사
#     5. 이 저장소(kyle-bot) → Settings → Secrets and variables → Actions
#        → New repository secret → 이름 `CAPRI_DEPLOY_TOKEN`, 값 붙여넣기
#
#   ※ 개인 계정 전체 권한을 가진 토큰은 쓰지 마세요. 위처럼 **두 저장소로 제한**한
#     토큰이면 혹시 새어 나가도 피해 범위가 작습니다.
#
# [토큰이 없으면?] 이 워크플로는 '무엇이 필요한지'만 알려 주고 조용히 끝납니다(실패 아님).
#   그 동안에는 PC에서 `npm run ship` 한 줄로 똑같이 배포할 수 있습니다.
#
# [서명] 코드 서명 인증서는 쓰지 않습니다(미서명). 첫 설치 때 SmartScreen 경고는 정상입니다.
# =============================================================================
name: ship (폰+PC 자동 배포)

on:
  push:
    branches: [main]
    paths:
      - "package.json" # 버전이 바뀐 경우에만 배포한다(문서만 고쳤을 때 매번 돌지 않게)
  workflow_dispatch: # 손으로도 실행 가능

jobs:
  ship:
    runs-on: windows-latest # 윈도우 설치파일(exe)은 윈도우에서만 만들 수 있다

    steps:
      - name: 소스 받기
        uses: actions/checkout@v4

      - name: 배포 토큰 확인
        id: gate
        shell: bash
        env:
          DEPLOY_TOKEN: ${{ secrets.CAPRI_DEPLOY_TOKEN }}
        run: |
          if [ -z "$DEPLOY_TOKEN" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CAPRI_DEPLOY_TOKEN 시크릿이 없어 자동 배포를 건너뜁니다."
            echo "설정 방법은 .github/workflows/ship.yml 맨 위 주석을 보세요."
            echo "그 전까지는 PC에서 'npm run ship' 으로 배포하면 됩니다."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Node 준비
        if: steps.gate.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 의존성 설치
        if: steps.gate.outputs.ready == 'true'
        run: npm ci

      - name: 검사(테스트 + 타입)
        if: steps.gate.outputs.ready == 'true'
        run: |
          npx vitest run
          npx tsc -b
          npm run web:check

      - name: 웹앱 빌드 + 배포(폰)
        if: steps.gate.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.CAPRI_DEPLOY_TOKEN }} # deploy-web.mjs 가 이 값을 먼저 찾는다
        run: |
          npm run web:build
          node scripts/deploy-web.mjs

      - name: 설치파일(exe) 빌드 + 릴리스 게시(PC)
        if: steps.gate.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.CAPRI_DEPLOY_TOKEN }} # publish-release.mjs 가 이 값을 먼저 찾는다
        run: |
          npm run dist:win
          node scripts/publish-release.mjs

      - name: 결과 안내
        if: steps.gate.outputs.ready == 'true'
        shell: bash
        run: |
          echo "폰(웹앱):  https://hun100b-dotcom.github.io/capri-web/"
          echo "PC(설치):  https://github.com/hun100b-dotcom/kyle-bot-releases/releases"
