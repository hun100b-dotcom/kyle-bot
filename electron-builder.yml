# =============================================================================
# electron-builder.yml — 설치 파일(dmg) 만들기 설정
# -----------------------------------------------------------------------------
# [이게 뭔가?]
#   electron-builder 라는 도구가 이 설정을 읽고, 빌드된 화면(dist/)과
#   봇 엔진(dist-electron/)을 묶어 "카일봇.app + 설치용 dmg"를 만들어 줍니다.
#   실행: npm run app:dist  →  release/ 폴더에 결과물 생성
# =============================================================================

appId: com.hun100b.kylebot
# 실행파일/폴더 이름은 영문으로 한다.
# [왜?] 실행파일 이름이 한글이면 macOS 에서 Electron 부팅이 죽는 문제(SIGTRAP)가
#   확인됐다. 대신 화면에 보이는 이름(Dock·메뉴)은 아래 extendInfo 로 "카일봇" 지정.
productName: KyleBot
directories:
  output: release        # 결과물이 담기는 폴더

# 앱 안에 포함할 파일들(소스 전체가 아니라 "빌드 결과물"만 담아 가볍게)
files:
  - dist/**              # React 화면 빌드 결과
  - dist-electron/**     # 봇 엔진(메인 프로세스) 빌드 결과
  - package.json

asar: true               # 앱 내부 파일을 하나의 아카이브로 묶음(표준)

mac:
  # Dock·정보 창에 보이는 표시 이름 (v2: 도구로 전환)
  extendInfo:
    CFBundleDisplayName: 카일 매매도구
  category: public.app-category.finance
  target:
    - target: dmg
      arch: [arm64]      # 애플 실리콘(M1~M4) 맥북용
  # 애플 개발자 인증서가 없어 서명은 Electron 기본(애드혹 링커 서명)에 맡긴다.
  # 개인 사용 목적으로는 이걸로 충분히 실행된다(처음 열 때만 우클릭→열기 필요할 수 있음).

dmg:
  title: 카일봇 설치
