# =============================================================================
# electron-builder.yml — 설치 파일(.exe / .dmg) 만들기 + 자동 배포 설정
# -----------------------------------------------------------------------------
# [이게 뭔가?]
#   electron-builder 가 이 설정을 읽고, 빌드된 화면(dist/)과 엔진(dist-electron/)을
#   묶어 "설치 파일"을 만듭니다.
#     - Windows: NSIS 설치파일(.exe)   → npm run dist:win
#     - macOS:   .dmg (Intel + Apple Silicon) → npm run dist:mac  (맥에서만 빌드 가능)
#   결과물은 release/ 폴더에 생성됩니다.
#
# [자동 업데이트 배포]
#   빌드 시 --publish always 를 주면 아래 공개 레포(kyle-bot-releases)에 설치파일 +
#   latest.yml(버전 정보)이 올라가고, 사용자 앱의 electron-updater 가 그걸 보고
#   새 버전을 감지합니다. 소스 레포(kyle-bot)는 private 유지, 배포는 공개 레포로 분리.
# =============================================================================

# [주의] appId 는 예전 값(kylebot)을 그대로 유지한다.
#   자동 업데이트는 이 appId(설치 식별자)로 기존 설치본을 인식하므로, 여기서 바꾸면
#   기존 사용자에게 "다른 앱"으로 취급돼 자동 업데이트가 끊긴다. 이름만 카프리로 바꾼다.
appId: com.hun100b.kylebot
# 실행파일/폴더 이름은 영문. (한글이면 macOS 부팅이 SIGTRAP 크래시 — 확인된 교훈)
# 화면에 보이는 이름은 mac.extendInfo / nsis.shortcutName 으로 한글 지정.
productName: Capri
directories:
  output: release

# ★★ 보안 핵심: 앱 안에 포함할 파일 화이트리스트(필요한 빌드 결과물만).
#   .env(실제 API 키)·소스는 절대 포함하지 않는다. 아래 제외 규칙으로 이중 차단.
files:
  - dist/**            # React 화면 빌드 결과
  - dist-electron/**   # 엔진(메인 프로세스) 빌드 결과
  - package.json
  # --- 명시적 제외(혹시라도 섞이지 않게 이중 안전장치) ---
  - "!**/.env"
  - "!**/.env.*"
  - "!**/*.map"

asar: true             # 앱 내부 파일을 하나의 아카이브로 묶음(표준)

# 자동 업데이트 배포 피드(바이너리 전용 공개 레포)
publish:
  provider: github
  owner: hun100b-dotcom
  repo: kyle-bot-releases
  releaseType: release

# ---------------- Windows ----------------
win:
  target:
    - target: nsis
      arch: [x64]
  # 코드서명 인증서 없음(유료) → 미서명 빌드. 첫 실행 시 SmartScreen 경고는
  # "추가 정보 → 실행"으로 통과(README 안내). 개인 사용엔 충분.

nsis:
  oneClick: false                # 설치 위치 선택 등 일반 설치 마법사 방식
  perMachine: false              # 관리자 권한 없이 현재 사용자에만 설치
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 카프리 매매도구      # 바탕화면/시작메뉴 아이콘 이름(한글 OK)

# ---------------- macOS ----------------
mac:
  extendInfo:
    CFBundleDisplayName: 카프리 매매도구
  category: public.app-category.finance
  target:
    - target: dmg
      arch: [arm64, x64]         # 애플 실리콘 + 인텔 맥 모두
  # 애플 개발자 인증서 없음 → 기본(ad-hoc) 서명. 첫 실행은 우클릭→열기(README 안내).

dmg:
  title: 카프리 매매도구 설치
