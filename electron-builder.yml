# =============================================================================
# electron-builder.yml — 설치 파일(.exe / .dmg) 만들기 + 자동 배포 설정
# -----------------------------------------------------------------------------
# [이게 뭔가?]
#   electron-builder 가 이 설정을 읽고, 빌드된 화면(dist/)과 엔진(dist-electron/)을
#   묶어 "설치 파일"을 만듭니다.
#     - Windows: NSIS 설치파일(.exe)   → npm run dist:win
#     - macOS:   .dmg (Intel + Apple Silicon) → npm run dist:mac  (맥에서만 빌드 가능)
#   결과물은 release/ 폴더에 생성됩니다.
#
# [자동 업데이트 배포]
#   빌드 시 --publish always 를 주면 아래 공개 레포(kyle-bot-releases)에 설치파일 +
#   latest.yml(버전 정보)이 올라가고, 사용자 앱의 electron-updater 가 그걸 보고
#   새 버전을 감지합니다. 소스 레포(kyle-bot)는 private 유지, 배포는 공개 레포로 분리.
# =============================================================================

# [주의] appId 는 예전 값(kylebot)을 그대로 유지한다.
#   자동 업데이트는 이 appId(설치 식별자)로 기존 설치본을 인식하므로, 여기서 바꾸면
#   기존 사용자에게 "다른 앱"으로 취급돼 자동 업데이트가 끊긴다. 이름만 Capri로 바꾼다.
appId: com.hun100b.kylebot
# 실행파일/폴더 이름은 영문. (한글이면 macOS 부팅이 SIGTRAP 크래시 — 확인된 교훈)
# 화면에 보이는 이름은 mac.extendInfo / nsis.shortcutName 으로 한글 지정.
productName: Capri
directories:
  output: release
  buildResources: build   # 아이콘 등 빌드 재료(build/icon.png) 위치

# 앱 아이콘 — 1024×1024 PNG 하나만 두면 electron-builder가 윈도우(.ico)·맥(.icns)로
# 알아서 변환한다. 이 PNG는 `npm run icon`(scripts/make-icon.mjs)으로 다시 만들 수 있다.
icon: build/icon.png

# ★★ 보안 핵심: 앱 안에 포함할 파일 화이트리스트(필요한 빌드 결과물만).
#   .env(실제 API 키)·소스는 절대 포함하지 않는다. 아래 제외 규칙으로 이중 차단.
files:
  - dist/**            # React 화면 빌드 결과
  - dist-electron/**   # 엔진(메인 프로세스) 빌드 결과
  - package.json
  # --- 명시적 제외(혹시라도 섞이지 않게 이중 안전장치) ---
  - "!**/.env"
  - "!**/.env.*"
  - "!**/*.map"

asar: true             # 앱 내부 파일을 하나의 아카이브로 묶음(표준)

# 자동 업데이트 배포 피드(바이너리 전용 공개 레포)
publish:
  provider: github
  owner: hun100b-dotcom
  repo: kyle-bot-releases
  releaseType: release

# ---------------- Windows ----------------
win:
  target:
    - target: nsis
      arch: [x64]
  # 코드서명 인증서 없음(유료) → 미서명 빌드. 첫 실행 시 SmartScreen 경고는
  # "추가 정보 → 실행"으로 통과(README 안내). 개인 사용엔 충분.
  # [교훈] signExecutable: false 가 없으면 electron-builder가 실제 서명 없이도
  #   exe에 "서명 흉내" 단계(signtool.exe 호출)를 시도하는데, 이건 윈도우가 아닌
  #   빌드 환경(예: 리눅스 CI/클라우드 세션)에서는 wine 이 없어 그대로 실패한다.
  #   아이콘·버전 정보 등 resedit 기반 메타데이터 편집(signAndEditExecutable)은 그대로
  #   두고, 서명 시도만 꺼서 어떤 OS에서 빌드하든 항상 성공하게 만든다.
  signExecutable: false

nsis:
  # [oneClick=true] 업데이트가 "매끄럽게" 적용되게 하는 핵심 설정.
  #   assisted(마법사) 모드면 자동 업데이트의 quitAndInstall 때 설치 마법사 창이 다시
  #   떠서 "또 설치하는" 느낌을 준다. oneClick 모드는 마법사 없이 조용히 재설치·재실행한다.
  #   (첫 설치도 원클릭으로 간편해진다.)
  oneClick: true
  perMachine: false              # 관리자 권한 없이 현재 사용자에만 설치
  allowToChangeInstallationDirectory: false  # oneClick 모드에선 경로 선택 없음(조용한 설치)
  createDesktopShortcut: true
  createStartMenuShortcut: true
  runAfterFinish: true           # 설치/업데이트 후 자동 실행
  shortcutName: Capri            # 바탕화면/시작메뉴 아이콘 이름

# ---------------- macOS ----------------
mac:
  extendInfo:
    CFBundleDisplayName: Capri
  category: public.app-category.finance
  target:
    # ★ 사람이 내려받는 파일은 **이 하나뿐**이다 — "올인원 설치팩".
    #
    # [왜 dmg를 버리고 pkg로 바꿨나 — 2026-10-16 신규 팀원 사고]
    #   dmg는 "열고 → 앱을 Applications로 끌어다 놓고 → 우클릭 열기"까지 사람이 해야 하는데,
    #   그렇게 설치하면 macOS가 붙인 격리 꼬리표(quarantine)가 **앱에 그대로 남는다.**
    #   애플 실리콘에서 "격리 꼬리표 + 애드혹 서명" 조합은 앱을 띄우다 말고 죽인다 —
    #   실제로 신규 팀원 M1 맥북에서 로그인 창이 0.4초 뜨고 사라지는 사고가 났다.
    #   pkg는 설치가 끝난 직후 build/pkg-scripts/postinstall 을 **관리자 권한으로 자동 실행**해
    #   그 꼬리표를 지우고 서명을 다시 찍는다. 사용자는 더블클릭 말곤 할 일이 없다.
    #
    # [왜 universal(하나로 합친 것)인가]
    #   예전엔 arm64용·Intel용 dmg를 따로 올려서 "내 맥이 어느 쪽인지" 사람이 알아서
    #   골라야 했고, 잘못 고르면 또 안 됐다. universal은 두 칩용을 한 파일에 담아 **고를
    #   일이 없다.** 용량은 2배지만, 사람이 받는 건 설치 때 딱 한 번뿐이라 값싼 거래다.
    - target: pkg
      arch: [universal]
    # ★ 자동 업데이트용(맥의 자동 교체는 dmg/pkg가 아니라 zip을 받는다 — mac-self-update.ts).
    #   이쪽은 칩별로 따로 둔다: 사람이 고르는 게 아니라 앱이 자기 칩에 맞는 걸 알아서
    #   받으므로 헷갈릴 일이 없고, universal로 만들면 배포할 때마다 2배(230MB)를 내려받게 돼
    #   하루에 몇 번씩 배포하는 지금 방식에선 낭비가 크다.
    - target: zip
      arch: [arm64, x64]
  # 애플 개발자 인증서 없음 → 애드혹(ad-hoc, "-") 서명. 첫 실행은 우클릭→열기(README 안내).
  # [주의] 공증(notarize)도 안 한다(유료 계정 필요). 개인 사용에는 우클릭→열기로 충분.
  #
  # [중요한 교훈 — v0.32.1] 예전엔 여기가 `identity: null`이었다. 이름과 달리 electron-builder
  # 소스(app-builder-lib/macPackager.js의 handleNullIdentity)를 직접 확인해 보니, `null`은
  # "서명 실패 방지용 애드혹"이 아니라 **서명 자체를 통째로 건너뛴다**는 뜻이었다(주석이 착각한
  # 것 — 실제로 맥 빌드를 CI에 연결해 본 적이 없어 아무도 몰랐던 문제). 애플 실리콘(M1 이후)
  # macOS는 인텔과 달리 **서명이 전혀 없는 arm64 실행파일은 커널이 아예 실행을 거부한다**
  # (Gatekeeper의 "확인되지 않은 개발자" 경고 이전 단계 — 우클릭→열기로도 못 고친다). `"-"`로
  # 명시하면 electron-builder가 실제로 애드혹 서명을 적용해(macCodeSign.js: qualifier === "-" 분기)
  # 인증서 없이도 앱이 최소한 실행은 되게 만든다. 우클릭→열기 안내는 이 상태에서도 여전히 필요
  # (Gatekeeper 격리 경고 자체는 애드혹 서명으로는 안 없어짐 — 공증까지 해야 완전히 없어짐).
  identity: "-"

# ---------------- macOS 올인원 설치팩(.pkg) ----------------
# [무엇이 달라지나] 더블클릭 → "계속 → 설치 → 비밀번호" 끝. 앱을 끌어다 놓을 필요도,
#   우클릭으로 열 필요도, 터미널을 열 필요도 없다. 설치가 끝나면 아래 postinstall이
#   격리 꼬리표를 지워 주므로 **첫 실행부터 그냥 열린다.**
#
# [남아 있는 유일한 한 단계] 설치팩 자체는 애플 인증서가 없어 미서명이라, 처음 받은
#   .pkg를 더블클릭하면 "확인되지 않은 개발자" 경고가 뜬다 → **우클릭 → 열기** 한 번이면
#   통과한다. 이것까지 없애려면 애플 개발자 계정(연 $99)으로 공증(notarize)해야 한다.
pkg:
  # 설치 위치를 /Applications 로 못박는다. 아래 postinstall 이 "$2/Capri.app" 을 찾아
  # 꼬리표를 지우는데, 사용자가 엉뚱한 곳에 설치하면 그 경로를 놓칠 수 있다.
  installLocation: /Applications
  allowAnywhere: false         # "원하는 위치에 설치" 선택지 숨김
  allowCurrentUserHome: false  # "나만 사용" 선택지 숨김(홈 폴더 설치 방지)
  allowRootDirectory: true     # /Applications 설치만 허용
  isRelocatable: false         # 이미 다른 곳에 있던 Capri.app 자리로 끌려가지 않게
  overwriteAction: upgrade     # 기존 버전이 있으면 덮어쓰기(업그레이드)
  # scripts 기본값이 "build/pkg-scripts" 라 따로 지정하지 않는다 — 그 폴더의
  # postinstall 이 설치 직후 자동 실행된다(그 파일 맨 위 주석에 이유를 전부 적어 뒀다).
